<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fanfic Story Kit · 同人剧情参考库</title>
<script>(function(){try{var t=localStorage.getItem('storykit-theme');if(t!=='light'&&t!=='dark'){t=(matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  :root {
    --bg:#0b0b0c; --panel:#151518; --line:#2b2b31; --text:#eceae5; --muted:#96938c; --dim:#6d6a64;
    --yellow:#ffd60a; --red:#ff3b30; --accent:#ffd60a;
    --font:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"JetBrains Mono",Consolas,monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font); line-height:1.75;
    background-image:radial-gradient(900px 520px at 75% -10%,rgba(255,214,10,.07),transparent 60%),
      radial-gradient(700px 420px at 0% 110%,rgba(69,200,241,.05),transparent 60%);
    min-height:100vh;
  }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:1000px; margin:0 auto; padding:56px 28px 80px; }
  .kicker { font-family:var(--mono); font-size:10px; letter-spacing:.28em; color:var(--yellow); text-transform:uppercase; display:flex; align-items:center; gap:10px; }
  .kicker::before { content:""; width:20px; height:2px; background:var(--yellow); }
  h1 { font-size:clamp(38px,7vw,76px); font-weight:900; line-height:1.02; letter-spacing:-.02em; margin:14px 0 16px; }
  h1 em { font-style:normal; color:var(--yellow); }
  .lead { max-width:620px; color:var(--muted); font-size:15px; margin:0 0 34px; }
  .hazard { height:8px; background:repeating-linear-gradient(45deg,var(--yellow) 0 12px,transparent 12px 24px); opacity:.6; margin:30px 0; }
  .work-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .work {
    display:block; border:1px solid var(--line); background:var(--panel); padding:22px; position:relative;
    transition:.16s ease; overflow:hidden;
  }
  .work:hover { border-color:var(--yellow); transform:translateY(-3px); box-shadow:6px 6px 0 rgba(255,214,10,.1); }
  .work::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent,var(--yellow)); }
  .badge {
    width:54px; height:54px; display:grid; place-items:center; background:var(--accent,var(--yellow));
    color:#000; font-weight:900; font-size:24px; clip-path:polygon(0 0,100% 0,100% 78%,82% 100%,0 100%);
    margin-bottom:16px;
  }
  .work h2 { font-size:22px; font-weight:900; margin:0; letter-spacing:.02em; }
  .work .en { font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; margin-top:2px; }
  .work p { font-size:12.5px; color:var(--muted); margin:11px 0 16px; min-height:44px; }
  .work-meta { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:10.5px; border:1px solid var(--line); color:var(--muted); padding:2px 7px; border-radius:2px; background:#111114; }
  .tag.y { color:#000; background:var(--yellow); border-color:var(--yellow); font-weight:700; }
  .soon {
    border:1px dashed var(--line); padding:22px; display:grid; place-items:center; color:var(--dim);
    font-size:12.5px; text-align:center; min-height:190px;
  }
  .soon b { display:block; color:var(--muted); font-size:14px; margin-bottom:4px; }
  .foot { margin-top:44px; padding-top:18px; border-top:1px solid var(--line); font-size:11px; color:var(--dim); display:flex; flex-wrap:wrap; gap:8px 20px; justify-content:space-between; }
  .foot a { color:var(--muted); border-bottom:1px dotted var(--line); }
  .theme-toggle{position:fixed;top:22px;right:24px;z-index:50;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:3px;cursor:pointer;font-size:16px;transition:.15s;}
  .theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
  :root[data-theme="light"]{--bg:#f6f4ee;--panel:#fff;--line:#ddd7c7;--text:#1d1b16;--muted:#5c574c;--dim:#8a8475;--accent:#8a5a00;}
  :root[data-theme="light"] body{background-image:radial-gradient(900px 520px at 75% -10%,rgba(255,180,0,.09),transparent 60%),radial-gradient(700px 420px at 0% 110%,rgba(69,200,241,.07),transparent 60%);}
  :root[data-theme="light"] h1 em{color:var(--accent);}
  :root[data-theme="light"] .kicker{color:var(--accent);}
  :root[data-theme="light"] .kicker::before{background:var(--accent);}
  :root[data-theme="light"] .tag{background:#fff;}
  :root[data-theme="light"] .work:hover{border-color:var(--accent);box-shadow:6px 6px 0 rgba(138,90,0,.12);}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="切换亮暗">☾</button>
<script>
(function(){
  var KEY='storykit-theme';
  var btn=document.getElementById('themeToggle');
  function resolve(){
    var t=null; try{t=localStorage.getItem(KEY);}catch(e){}
    if(t==='light'||t==='dark') return t;
    return (window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  }
  function apply(t){
    document.documentElement.setAttribute('data-theme',t);
    if(!btn) return;
    var light=t==='light';
    btn.textContent=light?'\u263e':'\u2600';
    var label=light?'\u5207\u6362\u5230\u6697\u8272':'\u5207\u6362\u5230\u4eae\u8272';
    btn.setAttribute('aria-label',label); btn.title=label;
  }
  apply(resolve());
  btn.addEventListener('click',function(){
    var next=resolve()==='light'?'dark':'light';
    try{localStorage.setItem(KEY,next);}catch(e){}
    apply(next);
  });
})();
</script>
<div class="wrap">
  <div class="kicker">Fanfic Story Kit / Archive</div>
  <h1>同人写作的<br><em>剧情参考库</em></h1>
  <p class="lead">每部作品一个文件夹。主线剧情、关键对话、角色背景、世界观与完整时间线，离线可查，也保留 Markdown 源文件方便直接改写。</p>

  <div class="hazard"></div>

  <div class="work-grid" id="works"></div>

  <div class="foot">
    <span>内容仅供同人创作参考，设定与台词版权归米哈游所有。</span>
    <span>快捷搜索：进入作品后按 <b style="color:var(--muted)">/</b></span>
  </div>
</div>

<script src="works.js"></script>
<script>
  var el = document.getElementById('works');
  var html = (window.WORKS || []).map(function (w) {
    return '<a class="work" href="' + w.path + '" style="--accent:' + (w.color || '#ffd60a') + '">' +
      '<div class="badge">' + (w.initial || w.name.slice(0, 1)) + '</div>' +
      '<h2>' + w.name + '</h2>' +
      '<div class="en">' + (w.en || '') + '</div>' +
      '<p>' + (w.desc || '') + '</p>' +
      '<div class="work-meta">' +
        '<span class="tag y">' + (w.status || '已收录') + '</span>' +
        '<span class="tag">更新 ' + (w.updated || '') + '</span>' +
      '</div></a>';
  }).join('');
  html += '<div class="soon"><div><b>更多作品</b>原神 / 崩坏：星穹铁道 / 崩坏3 ……<br>按同样的目录结构添加即可。</div></div>';
  el.innerHTML = html;
</script>
</body>
</html>
